[package]
name = "camapro-scope"
version = "0.3.0"
description = "Camapro Scope desktop controller (G1 skeleton)"
edition = "2021"
rust-version = "1.97"

[lib]
name = "camapro_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "camapro-scope"
path = "src/main.rs"

[[bin]]
name = "camaproctl"
path = "src/bin/camaproctl.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
sha2 = "0.10"
getrandom = "0.2"
crossbeam-channel = "0.5"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
jsonschema = "0.45"
