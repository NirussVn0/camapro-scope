[package]
name = "camapro-scope"
version = "0.2.0"
description = "Camapro Scope desktop controller (G1 skeleton)"
edition = "2021"
rust-version = "1.97"

[lib]
name = "camapro_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jsonschema = "0.45"
