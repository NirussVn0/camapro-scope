name: deterministic-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: pip install -r protocol/requirements-test.txt
      - name: Contract suite
        run: python -m unittest discover -s protocol/tests -v
      - name: Required test assets exist
        run: |
          test -f protocol/tests/test_contract.py
          test -f desktop/src-tauri/tests/protocol_contract.rs
          test -f android/app/src/test/java/app/camapro/scope/protocol/ProtocolContractTest.kt

  desktop-core:
    needs: protocol
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: System deps (webkit2gtk for tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - name: JS install (frozen lockfile)
        working-directory: desktop
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck + bundle
        working-directory: desktop
        run: pnpm typecheck && pnpm build
      - name: Rust format
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Contract parity tests
        working-directory: desktop/src-tauri
        run: cargo test --locked

  android-jvm:
    needs: protocol
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /tmp/sdkmanager.log 2>&1 || { tail -50 /tmp/sdkmanager.log; exit 1; }
      - name: Gradle wrapper checksum check
        run: grep -q "distributionSha256Sum" android/gradle/wrapper/gradle-wrapper.properties \
          || (echo "wrapper distribution must pin a sha256 checksum" && exit 1)
      - name: Lint + JVM contract tests + debug APK
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
